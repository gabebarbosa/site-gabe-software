document.getElementById('inf').onclick=e=>{e.preventDefault();ov.innerHTML='<div class="card"><b>Como jogar</b><p style="font-size:14px;line-height:1.5">Leve o pixel até o portal no topo, desviando dos obstáculos e fugindo da onda rosa que sobe do fundo.</p><p style="font-size:14px;line-height:1.5"><b>Celular:</b> toque na metade esquerda ou direita da tela para pular para aquele lado.<br><b>Computador:</b> Espaço pula, setas ou A/D movem.</p><p style="font-size:14px;line-height:1.5">São 200 fases em 20 mundos, eventos (Noite Assombrada e Rave Neon) e a Corrida infinita, tudo no menu <b>Fases</b>. O botão <b>Enviar</b> gera a imagem do seu resultado.</p><p style="font-size:13px;line-height:1.5;color:var(--mut)">Versão de teste: o progresso fica só neste aparelho. Para liberar todas as fases, abra Fases e toque 5 vezes no título.</p><div class="row"><button id="ix">Fechar</button></div></div>';ov.style.display='flex';document.getElementById('ix').onclick=()=>{ov.style.display='none'}};
startLevel();requestAnimationFrame(loop);
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,updateDoc,writeBatch,serverTimestamp,increment,collection,query,orderBy,limit,onSnapshot}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
// COLE AQUI o firebaseConfig do seu projeto (Configurações do projeto > Seus apps)
const cfg={apiKey:"COLE_AQUI",authDomain:"COLE_AQUI",projectId:"COLE_AQUI",appId:"COLE_AQUI"};
const on=!cfg.apiKey.startsWith("COLE"),$=id=>document.getElementById(id),ov=$('ov'),PE=window.PE;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const fmt=t=>{const m=Math.floor(t/60);return String(m).padStart(2,'0')+':'+(t-m*60).toFixed(2).padStart(5,'0')};
const sug=()=>{const a=['Pixel','Neon','Turbo','Sombra','Cometa','Atomo'],b=['Raposa','Gato','Lobo','Ninja','Fantasma','Coruja'];return a[Math.random()*6|0]+b[Math.random()*6|0]+(10+Math.random()*90|0)};
const BAD=['porra','merda','caralho','buceta','nazi','hitler']; // amplie esta lista
let auth,db,user=null,nick=null,unsub=null,shown=false;
if(on){const app=initializeApp(cfg);auth=getAuth(app);db=getFirestore(app)}
function modal(h){ov.innerHTML='<div class="card">'+h+'</div>';ov.style.display='flex'}
function closeM(){ov.style.display='none';if(unsub){unsub();unsub=null}}
ov.addEventListener('click',e=>{if(e.target===ov)closeM()});
function paint(){PE.nick=nick||'';for(const k in PE.wr)PE.wr[k].mine=!!user&&PE.wr[k].uid===user.uid;$('login').textContent=user?(nick||'Perfil'):'Entrar'}
function nickModal(first){
 modal(`<b>${first?'Escolha seu nome no ranking':'Seu perfil'}</b><p style="font-size:13px;color:var(--mut)">3 a 16 letras, números ou _. Só esse nome aparece para os outros.</p><input id="ni" maxlength="16" value="${esc(nick||sug())}" autocomplete="off"><div class="err" id="ne"></div><div class="row"><button id="ns">Salvar</button>${first?'':'<button id="no">Sair</button>'}</div>`);
 $('ns').onclick=saveNick;
 if(!first)$('no').onclick=()=>{signOut(auth);closeM()};
}
async function saveNick(){
 const v=$('ni').value.trim(),e=$('ne');
 if(!/^[A-Za-z0-9_]{3,16}$/.test(v)){e.textContent='Use 3 a 16 letras, números ou _.';return}
 if(BAD.some(w=>v.toLowerCase().includes(w))){e.textContent='Escolha outro nome.';return}
 const k=v.toLowerCase(),old=nick&&nick.toLowerCase();
 try{
  if(k!==old){const s=await getDoc(doc(db,'usernames',k));if(s.exists()&&s.data().uid!==user.uid){e.textContent='Esse nome já está em uso.';return}}
  const b=writeBatch(db);
  if(k!==old)b.set(doc(db,'usernames',k),{uid:user.uid});
  if(old&&k!==old)b.delete(doc(db,'usernames',old));
  b.set(doc(db,'users',user.uid),{uid:user.uid,displayName:v,...(old?{}:{createdAt:serverTimestamp()})},{merge:true});
  await b.commit();nick=v;closeM();paint();sub();
 }catch(err){e.textContent='Não foi possível salvar. Tente de novo.'}
}
async function submit(l,t,a){
 if(!user||!nick||t==null)return;
 const r=doc(db,'level_scores',String(l),'entries',user.uid);
 try{const s=await getDoc(r);
  if(!s.exists())await setDoc(r,{level:l,userId:user.uid,displayName:nick,timeInSeconds:t,attempts:a,completed:true,timestamp:serverTimestamp()});
  else if(t<s.data().timeInSeconds)await updateDoc(r,{displayName:nick,timeInSeconds:t,attempts:a,timestamp:serverTimestamp()})}catch(e){}
}
const sub=()=>submit(PE.lvl,PE.best,PE.att);
let ptimer=0;
async function pushProg(){if(!user)return;const q=PE.prog;try{await setDoc(doc(db,'progress',user.uid),{max:q.max||1,skin:q.skin||0,trophy:q.trophy||0,em:q.em||0,best:q.best,updatedAt:serverTimestamp()})}catch(e){}}
async function pullProg(){if(!user)return;try{const r=await getDoc(doc(db,'progress',user.uid));if(r.exists())PE.merge(r.data());if(PE.prog.em>0)dispatchEvent(new CustomEvent('pe-endless',{detail:{m:PE.prog.em}}));await pushProg()}catch(e){}}
addEventListener('pe-progress',()=>{clearTimeout(ptimer);ptimer=setTimeout(pushProg,3000)});
const enc=p=>p.map(v=>Math.max(0,Math.min(1295,v|0)).toString(36).padStart(2,'0')).join('');
const wrl={};
async function loadWR(l){if(!on||l<1||wrl[l])return;wrl[l]=1;try{const r=await getDoc(doc(db,'level_ghosts',String(l)));if(r.exists()){const v=r.data(),q=[];for(let i=0;i+1<v.p.length;i+=2)q.push(parseInt(v.p.substr(i,2),36));PE.wr[l]={p:q,t:v.timeInSeconds,name:v.displayName,uid:v.userId,mine:!!user&&v.userId===user.uid}}}catch(e){wrl[l]=0}}
async function submitGhost(d){if(!user||!nick||!on||d.lvl<1)return;const r=doc(db,'level_ghosts',String(d.lvl));try{const s=await getDoc(r);if(s.exists()&&s.data().timeInSeconds<=d.t)return;const e=enc(d.p);if(e.length>6000)return;await setDoc(r,{level:d.lvl,userId:user.uid,displayName:nick,timeInSeconds:d.t,p:e,timestamp:serverTimestamp()});PE.wr[d.lvl]={p:d.p,t:d.t,name:nick,uid:user.uid,mine:true}}catch(e){}}
addEventListener('pe-endless',async ev=>{if(!user||!nick||!on)return;const r=doc(db,'endless_scores',user.uid);try{const q=await getDoc(r);if(q.exists()&&q.data().meters>=ev.detail.m)return;await setDoc(r,{userId:user.uid,displayName:nick,meters:ev.detail.m,timestamp:serverTimestamp()})}catch(e){}});
const loaded={},pend={};
async function loadStats(l){if(!on||l<1||loaded[l])return;loaded[l]=1;try{const s=await getDoc(doc(db,'level_stats',String(l))),v=s.exists()?s.data():{deaths:0,wins:0},q=pend[l]||{d:0,w:0};PE.gst[l]={d:v.deaths+q.d,w:v.wins+q.w}}catch(e){loaded[l]=0}}
function bump(l,k){(pend[l]=pend[l]||{d:0,w:0})[k]++}
async function flush(){if(!on)return;for(const l of Object.keys(pend)){const q=pend[l];if(!q.d&&!q.w)continue;pend[l]={d:0,w:0};try{await setDoc(doc(db,'level_stats',l),{deaths:increment(q.d),wins:increment(q.w)},{merge:true})}catch(e){pend[l].d+=q.d;pend[l].w+=q.w}}}
setInterval(flush,20000);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
addEventListener('pe-level',ev=>{loadStats(ev.detail.lvl);loadWR(ev.detail.lvl)});addEventListener('pe-death',ev=>bump(ev.detail.lvl,'d'));loadStats(PE.lvl);loadWR(PE.lvl);
if(on)onAuthStateChanged(auth,async u=>{user=u;nick=null;if(u){try{const s=await getDoc(doc(db,'users',u.uid));if(s.exists())nick=s.data().displayName;else nickModal(true)}catch(e){}}paint();sub();if(u)pullProg()});
$('login').onclick=async()=>{
 if(!on){modal('<b>Configuração pendente</b><p style="font-size:13px">Cole o firebaseConfig no início do script do arquivo para ativar login e ranking.</p><div class="row"><button id="x">Ok</button></div>');$('x').onclick=closeM;return}
 if(!user){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){}return}
 nickModal(!nick)};
$('rank').onclick=()=>{
 if(!on){$('login').click();return}
 modal('<b>Ranking · '+(PE.endless?'Corrida infinita':PE.lvl>200?'Evento '+((PE.lvl-201)%10+1):'Fase '+PE.lvl)+'</b><ol id="rl" style="padding-left:22px;font-size:14px;line-height:1.7"></ol><div class="row"><button id="x">Fechar</button></div>');$('x').onclick=closeM;
 unsub=onSnapshot(PE.endless?query(collection(db,'endless_scores'),orderBy('meters','desc'),limit(20)):query(collection(db,'level_scores',String(PE.lvl),'entries'),orderBy('timeInSeconds'),limit(20)),s=>{
  const l=$('rl');if(!l)return;
  l.innerHTML=s.empty?'<li style="list-style:none;margin-left:-22px;color:var(--mut)">Ninguém escapou ainda. Seja o primeiro!</li>':s.docs.map(d=>{const v=d.data();return'<li'+(user&&d.id===user.uid?' style="font-weight:700"':'')+'>'+esc(v.displayName)+' — '+(PE.endless?v.meters+' m':fmt(v.timeInSeconds))+'</li>'}).join('')})};
addEventListener('pe-win',ev=>{bump(ev.detail.lvl,'w');submitGhost(ev.detail);
 if(user&&nick)submit(ev.detail.lvl,ev.detail.t,ev.detail.att);
 else if(on&&!user&&!shown){shown=true;modal('<b>Salve seu tempo no ranking</b><p style="font-size:13px;color:var(--mut)">Entre com Google para aparecer no ranking.</p><div class="row"><button id="g">Entrar com Google</button><button id="l">Agora não</button></div>');$('g').onclick=()=>{closeM();$('login').click()};$('l').onclick=closeM}});
</script>
</body>
</html>
