<script>
const $=id=>document.getElementById(id),C=$('c'),X=C.getContext('2d'),T=32,FH=6;
let lv=1,max=1,L,P,ov=1,time=0,deaths=0,flash=0,cx0=0,cy0=0,sc=1,last=0,ac,bonus=0,rec=[],rt=0,G=[],mus=1,musOn=0,step=0,nxT=0,lastSc=0,assist=0,msgT=0,msgS='';
const K={L:0,R:0,U:0,D:0,J:0,Jp:0,JpU:0};
try{max=Math.min(100,+localStorage.getItem('ns3')||1);lv=max}catch(e){}
const rnd=s=>()=>(s=(s*1664525+1013904223)>>>0)/4294967296;
const hu=o=>`hsl(${(time*50+o+(L?L.th.h:0))%360},100%,60%)`;
function beep(f,d=.08,ty='square',v=.04){try{ac=ac||new AudioContext;const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}

const TH=[{n:'CASSINO',h:300},{n:'LABORATÓRIO',h:140},{n:'COBERTURA',h:200},{n:'CYBERSELVA',h:90},{n:'COFRE',h:0}];
function nt(t,f,d,ty,v,f2){const o=ac.createOscillator(),g=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}
function music(){if(musOn)return;try{ac=ac||new AudioContext;musOn=1;nxT=ac.currentTime+.1;
 const tick=()=>{if(mus){const sd=60/(L&&L.alarm?150:104)/4,r=55*2**((L?L.wd*2:0)/12);
  while(nxT<ac.currentTime+.25){const s=step++,t=nxT;
   if(s%4==0)nt(t,150,.14,'sine',.14,40);
   if(s%2)nt(t,9000,.03,'square',.008);
   nt(t,r*2**([0,0,3,0,5,0,7,3][s%8]/12),sd*.9,'sawtooth',.035);
   if(s%2)nt(t,r*8*2**([0,3,7,10,12,10,7,3][(s>>1)%8]/12),sd*1.5,'square',.012);
   nxT+=sd}}else nxT=ac.currentTime+.1;setTimeout(tick,60)};tick()}catch(e){}}
function gen0(n,sd,att){
 const R=rnd((sd||n)*7919+13+att*104729),wd=Math.min(4,(n-1)/20|0),F=Math.min(8,6+(n/40|0)),W=Math.min(40,18+(n*.22|0)),RR=F*FH+2,g0=RR-2,fs=[],lad=[],bx=[];
 for(let i=0;i<F;i++)fs.push(g0-i*FH);
 const grid=[...Array(W)].map(()=>new Uint8Array(RR));
 for(let x=0;x<W;x++){grid[x][0]=grid[x][g0]=grid[x][g0+1]=1;for(let i=1;i<F;i++)grid[x][fs[i]]=1}
 for(let i=1;i<F;i++){const tx=i%2?W-4:3;grid[tx][fs[i]]=2;lad.push({tx,i,x:(tx+.5)*T,top:fs[i]*T,bot:fs[i-1]*T})}
 const ct=(F-1)%2?3:W-3,gs=[],cs=[],ls=[],dr=[],cr=[];
 const near=(x,i)=>lad.some(l=>(l.i==i||l.i==i+1)&&Math.abs(l.tx-x)<4)||(i==0&&x<7)||(i==F-1&&Math.abs(x-ct)<4);
 const hide=(x,y,i)=>{if(x>4&&x<W-4&&!near(x,i))cr.push({x:x*T,y,w:T*1.5,t:R()*3|0})};
 lad.forEach(l=>{cr.push({x:l.x,y:l.top,w:T*1.5,t:2});cr.push({x:l.x,y:l.bot,w:T*1.5,t:2})});cr.push({x:2.5*T,y:fs[0]*T,w:T*1.5,t:2});cr.push({x:(ct+.5)*T,y:fs[F-1]*T,w:T*1.5,t:2});
 for(let i=0;i<F;i++){const y=fs[i]*T;
  for(let x=7+(R()*3|0);x<W-6;x+=8+(R()*3|0)){
   if(R()<.6)hide(x+4.5,y,i);
   if(near(x,i)||R()>.6+n*.003)continue;
   const ty=['g','g','b'];if(n>=3)ty.push('c');if(n>=6)ty.push('l','l');if(n>=15)ty.push('d','d');if(wd==1)ty.push('l','l');if(wd==2)ty.push('d','c');if(wd==3)ty.push('g','g');if(wd==4)ty.push('c','d','l');
   const t=ty[R()*ty.length|0];
   if(t=='g'){gs.push({a:(x-4)*T,b:(x+4)*T,x:x*T,y,dir:R()<.5?1:-1,v:55+n*.5,pz:0});hide(x-4,y,i);hide(x,y,i);hide(x+4,y,i)}
   else if(t=='b'){const w=1+(R()<.5?1:0),h=1+(R()<n/150?1:0);bx.push({x:x*T,y:y-h*T,w:w*T,h:h*T});for(let a=0;a<w;a++)for(let b=1;b<=h;b++)grid[x+a][fs[i]-b]=1}
   else if(t=='c'){cs.push({x:(x+.5)*T,y:y-150,fy:y,sw:.55+R()*.15,sp:1.1+R()*.6+n*.008,ph:R()*6});hide(x-2,y,i);hide(x+2,y,i)}
   else if(t=='l'){ls.push({x:(x+.5)*T,y,t:R()<.5?0:2,ph:R()*3,per:Math.max(1.7,2.4-n*.007),on:Math.max(.9,1.3-n*.004)});hide(x-3,y,i)}
   else{dr.push({a:(x-5)*T,b:(x+5)*T,x:x*T,y,dir:R()<.5?1:-1,v:80+n*.6});hide(x-3,y,i);hide(x+3,y,i)}
  }}
 if(n%10==0&&!sd){gs.push({boss:1,a:6*T,b:(W-6)*T,x:(W/2)*T,y:fs[F-1]*T,dir:1,v:70+n*.4,pz:0});for(let hx=8;hx<W-8;hx+=6)hide(hx,fs[F-1]*T,F-1)}
 const doors=[],keys=[];
 if(n>=15)for(let i=0;i<F;i++)if(R()<.55){let x=(W>>1)+(R()*5-2|0);for(let k=0;k<8&&(grid[x][fs[i]-1]||grid[x+1][fs[i]-1]);k++)x++;
  const kx=(i==0||i%2==0)?x-3:Math.min(W-2,x+3);for(let r=1;r<=5;r++)grid[x][fs[i]-r]=3;doors.push({x,y:fs[i]*T,open:0});keys.push({x:(kx+.5)*T,y:fs[i]*T,d:doors.length-1,got:0})}
 return{W,F,RR,g0,fs,grid,lad,gs,cs,ls,dr,cr,bx,doors,keys,wd,th:TH[wd],boss:n%10==0&&!sd,cx:(ct+.5)*T,cy:fs[F-1]*T}
}
/* verificação: simula guardas, câmeras, drones e lasers no tempo e garante rota segura entre esconderijos */
const STEP=.1,NT=360,CELL=13;
function simG(g,mul){const X=[],D=[];let x=g.x,d=g.dir,pz=0;const v=g.v*mul;for(let i=0;i<=NT;i++){X.push(x);D.push(d);if(pz>0)pz-=STEP;else{x+=d*v*STEP;if(x>g.b){x=g.b;d=-1;pz=.9}if(x<g.a){x=g.a;d=1;pz=.9}}}return[X,D]}
function simD(o,mul){const X=[];let x=o.x,d=o.dir;const v=o.v*mul;for(let i=0;i<=NT;i++){X.push(x);x+=d*v*STEP;if(x>o.b){x=o.b;d=-1}if(x<o.a){x=o.a;d=1}}return[X]}
function mk(L,f,mode){const y=L.fs[f]*T,mul=mode?1.35:1,rg=mode?1.2:1,Kc=Math.ceil(L.W*T/CELL),cx=k=>k*CELL+CELL/2;
 const gF=L.gs.filter(g=>g.y==y).map(g=>({g,s:simG(g,mul)})),cF=L.cs.filter(c=>c.fy==y),dF=L.dr.filter(d=>d.y==y).map(d=>({d,s:simD(d,mul)})),lF=L.ls.filter(l=>l.y==y),rF=L.cr.filter(c=>c.y==y);
 const hid=new Uint8Array(Kc);for(let k=0;k<Kc;k++)hid[k]=rF.some(c=>Math.abs(cx(k)-c.x)<c.w/2-4)?1:0;
 const st=[];
 for(let t=0;t<=NT;t++){const a=new Uint8Array(Kc),tt=t*STEP;
  for(let k=0;k<Kc;k++){const x=cx(k);let r=0;
   for(const o of gF){const dx=x-o.s[0][t],R=(o.g.boss?290:175+lv*.8)*rg+20;if((dx*o.s[1][t]>0&&Math.abs(dx)<R)||Math.abs(dx)<60){r=1;break}}
   if(!r)for(const c of cF)if(inCone(c.x,c.y,Math.PI/2+Math.sin(tt*c.sp+c.ph)*c.sw,.36,215*rg+12,x,y-14)){r=1;break}
   if(!r)for(const o of dF)if(inCone(o.s[0][t],y-80,Math.PI/2,.56,100*rg+12,x,y-14)){r=1;break}
   for(const l of lF){const p=(tt+l.ph)%l.per;if((p<l.on+.15||p>l.per-.15)&&Math.abs(x-l.x)<(l.t==0?7:T)+17){r=3;break}}
   a[k]=r}
  st.push(a)}
 return{st,hid,Kc,y,cx}}
function pass(L,m,xa,xb,up){const{st,hid,Kc,y,cx}=m,kc=x=>Math.max(0,Math.min(Kc-1,x/CELL|0));
 const door=up?L.doors.find(d=>d.y==y):null,dk=door?L.keys[L.doors.indexOf(door)]:null,dLo=door?door.x*T-12:0,dHi=door?(door.x+1)*T+12:0,kk=dk?kc(dk.x):-1,ka=kc(xa),kb=kc(xb);
 let cur=new Uint8Array(Kc*2);cur[(ka<<1)|(door?0:1)]=1;
 for(let t=0;t<NT;t++){const nx=new Uint8Array(Kc*2);let any=0;
  for(let i=0;i<Kc*2;i++)if(cur[i]){const k=i>>1,key=i&1;
   for(let d=-1;d<=1;d++){const k2=k+d;if(k2<0||k2>=Kc)continue;
    if(door&&!key){const x2=cx(k2);if(x2>dLo&&x2<dHi)continue}
    const s=st[t+1][k2];if(s==3||(s==1&&!(d==0&&hid[k2])))continue;
    nx[(k2<<1)|((key||(door&&k2==kk))?1:0)]=1;any=1}}
  if(!any)return false;cur=nx;if(cur[(kb<<1)|1])return true}
 return false}
function winOK(m,x){const k=Math.max(0,Math.min(m.Kc-1,x/CELL|0));for(let t=0;t<=NT-14;t++){let ok=1;for(let s=0;s<14;s++)if(m.st[t+s][k]){ok=0;break}if(ok)return true}return false}
function verify(L){const bad=new Set,F=L.F,lx=L.lad.map(l=>l.x),sx=2.5*T;
 for(let f=0;f<F;f++){const m0=mk(L,f,0),m1=mk(L,f,1),a=f?lx[f-1]:sx,b=f<F-1?lx[f]:L.cx;
  if(!pass(L,m0,a,b,1)||!pass(L,m1,b,a,0))bad.add(f);
  if(f<F-1&&!(winOK(m0,lx[f])&&winOK(m1,lx[f])))bad.add(f)}
 return bad}
function strip(L,f){const y=L.fs[f]*T;L.gs=L.gs.filter(g=>g.y!=y);L.cs=L.cs.filter(c=>c.fy!=y);L.ls=L.ls.filter(l=>l.y!=y);L.dr=L.dr.filter(d=>d.y!=y)}
function gen(n,sd){let best=null,bf=1e9;for(let a=0;a<6;a++){const L=gen0(n,sd,a),b=verify(L);if(b.size<bf){bf=b.size;best=L}if(!b.size)break}
 if(bf)verify(best).forEach(f=>strip(best,f));return best}
const solid=(tx,ty)=>{if(tx<0||tx>=L.W)return 1;if(ty<0)return 0;if(ty>=L.RR)return 1;const v=L.grid[tx][ty];return v==1||v==3||(v==2&&!P.cl&&!K.D)};
function hit(x,y,w,h){for(let tx=Math.floor(x/T);tx<=Math.floor((x+w-.01)/T);tx++)for(let ty=Math.floor(y/T);ty<=Math.floor((y+h-.01)/T);ty++)if(solid(tx,ty))return 1;return 0}
function load(n,sd){lv=n;L=gen(n,sd);L.daily=!!sd;L.alarm=0;L.emp=0;L.it={s:1+bonus,e:1+bonus,c:1+bonus};bonus=0;P={x:2.5*T,y:L.fs[0]*T,vx:0,vy:0,g:1,cy:0,bf:0,f:1,cr:0,m:0,has:0,hid:0,cl:0,mv:0,seen:0,ck:0};time=0;deaths=0;cx0=0;cy0=0;rec=[];rt=0;G=[];try{if(!sd)G=JSON.parse(localStorage.getItem('ns3g'+n)||'[]')}catch(e){}ov=0;$('ov').hidden=true;ui();itemUI()}
function ui(){const a=Math.round((L.fs[0]*T-P.y)/(FH*T))+1;$('hud').textContent=`${L.daily?'DIÁRIO':'FASE '+lv}${L.boss?' 👹':''} · ${Math.min(L.F,a)}/${L.F} · ☠${deaths}`}
function msg(t,p,b,f,sh,dl){ov=1;$('ot').textContent=t;$('op').textContent=p;$('ob').textContent=b;$('ob').onclick=()=>{$('ov').hidden=true;ov=0;f()};$('os').hidden=!sh;$('oa').hidden=!sh;$('od').hidden=!dl;$('ov').hidden=false}
function itemUI(){const i=L.it;document.querySelectorAll('#it button').forEach(b=>{const k=b.dataset.i;if(k!='f')b.textContent={s:'💨',e:'⚡',c:'🪙'}[k]+i[k]})}
const FB=''; /* cole aqui a URL do Realtime Database, ex.: https://SEU-PROJETO-default-rtdb.firebaseio.com */
async function rankSubmit(k,s){if(!FB)return null;try{let nm=localStorage.getItem('ns3n')||prompt('Seu nome no ranking (até 12 letras):')||'AGENTE';nm=nm.slice(0,12);localStorage.setItem('ns3n',nm);
 await fetch(`${FB}/rank/${k}.json`,{method:'POST',body:JSON.stringify({n:nm,s:s,t:Date.now()})});
 const o=await (await fetch(`${FB}/rank/${k}.json?orderBy="s"&limitToLast=5`)).json();
 return Object.values(o||{}).sort((a,b)=>b.s-a.s).map((e,i)=>`${i+1}. ${e.n} ${e.s}`).join('\n')}catch(e){return null}}
const rewarded=cb=>{try{typeof window.__ad=='function'?window.__ad(cb):cb()}catch(e){cb()}};
$('os').onclick=async()=>{const t=`Fiz ${lastSc} pts na fase ${lv} do NEON SPY! Consegue me superar?`;try{const b=await new Promise(r=>C.toBlob(r)),f=new File([b],'neon-spy.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],text:t,url:location.href});else if(navigator.share)await navigator.share({text:t,url:location.href});else await navigator.clipboard.writeText(t+' '+location.href)}catch(e){}};
$('oa').onclick=()=>rewarded(()=>{bonus++;$('oa').hidden=true});
$('od').onclick=()=>{const d=Math.floor(Date.now()/864e5);load(40+d%40,d+777)};
$('mu').onclick=()=>{mus=!mus;$('mu').textContent=mus?'🔊':'🔇';try{localStorage.setItem('ns3m',mus?1:0)}catch(e){}};
function wp(){const f=Math.max(0,Math.min(L.F-1,Math.round((L.fs[0]*T-P.y)/(FH*T))));
 if(!P.has){if(f<L.F-1){const l=L.lad[f];return[l.x,l.bot-60]}return[L.cx,L.cy-30]}
 if(f>0){const l=L.lad[f-1];return[l.x,l.top-60]}return[1.5*T,L.fs[0]*T-50]}
function pauseM(){if(ov||!L)return;ov=1;$('pa').textContent='MODO ASSISTIDO: '+(assist?'LIGADO':'DESLIGADO');const g=$('pg');g.innerHTML='';
 for(let i=1;i<=100;i++){const b=document.createElement('button');let s=0;try{s=JSON.parse(localStorage.getItem('ns3b'+i)||'{}').s||0}catch(e){}b.textContent=i+(s>=11000?'★':s?'✓':'');b.disabled=i>max;b.onclick=()=>{$('pm').hidden=true;ov=0;load(i)};g.appendChild(b)}
 $('pm').hidden=false}
$('hud').onclick=pauseM;$('pc').onclick=()=>{$('pm').hidden=true;ov=0};$('pr').onclick=()=>{$('pm').hidden=true;ov=0;load(lv)};
$('pa').onclick=()=>{assist=assist?0:1;try{localStorage.setItem('ns3a',assist)}catch(e){}$('pa').textContent='MODO ASSISTIDO: '+(assist?'LIGADO':'DESLIGADO')};
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseM()});
function toast(s,t=1.6){msgS=s;msgT=t}
function die(c){deaths++;flash=1;toast(deaths%3==0?'Dica: 💨 esconde · ⚡ desliga câmeras e lasers':c||'VISTO!',deaths%3==0?3:1.4);try{navigator.vibrate(150)}catch(e){}beep(110,.35,'sawtooth',.07);
 if(P.ck){P.x=P.ck.x;P.y=P.ck.y}else if(P.has){P.x=L.cx;P.y=L.cy}else{P.x=2.5*T;P.y=L.fs[0]*T}
 Object.assign(P,{vx:0,vy:0,m:0,cr:0,cl:0,g:1});ui()}
function inCone(ox,oy,a,hf,r,x,y){const dx=x-ox,dy=y-oy;if(Math.hypot(dx,dy)>r)return 0;
 let d=Math.atan2(dy,dx)-a;d=Math.abs(((d+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI);return d<hf}
const rb=()=>L.alarm?1.2:1;
const gOrg=g=>[g.x,g.y-(g.boss?42:26),g.dir>0?.14:Math.PI-.14,g.boss?.6:.45,(g.boss?290:175+lv*.8)*rb()];
const cOrg=c=>[c.x,c.y,Math.PI/2+Math.sin(time*c.sp+c.ph)*c.sw,.3,215*rb()];
